
<!DOCTYPE html>
<html>
<head>
  <title>DJ YURA</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(black, #111);
    }

    h1 {
      font-size: 60px;
      letter-spacing: 5px;
    }

    p {
      opacity: 0.7;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      border: 1px solid white;
      cursor: pointer;
      text-decoration: none;
      color: white;
    }

    .btn:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>DJ YURA</h1>
    <p>Progressive House / Open Format</p>

    <a class="btn" href="#">Instagram</a>
  </div>

</body>
</html>
